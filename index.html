<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پروفایل یحیی بوریائی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #060d1e;
  --surface: #ffffff;
  --border: rgba(255,255,255,0.1);
  --muted: #94a3b8;
  --accent: #38bdf8;
  --shadow: 0 40px 80px -20px rgba(0,0,0,0.7);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Vazirmatn', sans-serif;
  min-height: 100vh;
  background:
    radial-gradient(ellipse 70% 50% at 20% 5%, rgba(56,189,248,0.18) 0%, transparent 55%),
    radial-gradient(ellipse 60% 60% at 80% 90%, rgba(14,165,233,0.12) 0%, transparent 55%),
    linear-gradient(160deg, #060d1e 0%, #0c1a3a 50%, #050c1a 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
}

.card {
  width: 100%;
  max-width: 380px;
  border-radius: 28px;
  overflow: hidden;
  box-shadow: var(--shadow);
}

/* ── Header ── */
.header {
  background: linear-gradient(145deg, #0f1f3d 0%, #1a3a6e 60%, #0d2050 100%);
  padding: 40px 28px 32px;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.header::before {
  content: '';
  position: absolute;
  top: -60px; left: -60px;
  width: 220px; height: 220px;
  background: radial-gradient(circle, rgba(56,189,248,0.18) 0%, transparent 70%);
}

.header::after {
  content: '';
  position: absolute;
  bottom: -50px; right: -40px;
  width: 180px; height: 180px;
  background: radial-gradient(circle, rgba(14,165,233,0.12) 0%, transparent 70%);
}

.avatar {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  font-weight: 800;
  color: #fff;
  margin: 0 auto 18px;
  border: 3px solid rgba(255,255,255,0.2);
  position: relative;
  z-index: 1;
}

.name {
  font-size: 1.75rem;
  font-weight: 800;
  color: #ffffff;
  margin-bottom: 8px;
  position: relative;
  z-index: 1;
}

.role {
  font-size: 0.9rem;
  font-weight: 600;
  color: #7dd3fc;
  position: relative;
  z-index: 1;
  line-height: 1.7;
}

/* ── Body ── */
.body {
  background: #ffffff;
  padding: 28px 24px 24px;
}

.bio {
  color: #475569;
  font-size: 0.9rem;
  line-height: 2;
  text-align: center;
  margin-bottom: 20px;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-bottom: 24px;
}

.chip {
  font-size: 0.78rem;
  font-weight: 600;
  padding: 5px 14px;
  border-radius: 20px;
  background: #f1f5f9;
  color: #334155;
  border: 1px solid #e2e8f0;
  font-family: 'Vazirmatn', sans-serif;
}

.save-btn {
  display: block;
  width: 100%;
  padding: 15px;
  background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
  color: #fff;
  font-family: 'Vazirmatn', sans-serif;
  font-size: 0.95rem;
  font-weight: 800;
  text-align: center;
  text-decoration: none;
  border-radius: 16px;
  margin-bottom: 14px;
  transition: opacity 0.2s;
}

.save-btn:hover { opacity: 0.9; }

.divider {
  height: 1px;
  background: #e2e8f0;
  margin: 4px 0 14px;
}

.social-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}

.social-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 13px;
  border-radius: 14px;
  font-family: 'Vazirmatn', sans-serif;
  font-size: 0.92rem;
  font-weight: 700;
  text-decoration: none;
  color: #fff;
  transition: opacity 0.2s;
}

.social-btn:hover { opacity: 0.88; }
.eitaa  { background: #e65100; }
.rubika { background: #6a1b9a; }

.calls { display: flex; flex-direction: column; gap: 10px; }

.call-btn {
  display: block;
  padding: 16px 18px;
  border-radius: 16px;
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  text-decoration: none;
  text-align: center;
  transition: background 0.2s;
}

.call-btn:hover { background: #f1f5f9; }

.call-label {
  font-size: 0.75rem;
  color: #64748b;
  font-family: 'Vazirmatn', sans-serif;
  margin-bottom: 4px;
}

.call-num {
  font-size: 1.1rem;
  font-weight: 800;
  color: #0f172a;
  font-family: 'Vazirmatn', sans-serif;
  direction: ltr;
  letter-spacing: 1px;
}

.footer {
  text-align: center;
  margin-top: 20px;
  font-size: 0.65rem;
  color: #94a3b8;
  letter-spacing: 3px;
  font-family: 'Vazirmatn', sans-serif;
}
</style>
</head>

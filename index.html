<style>

:root{
--bg:#070b18;
--card:rgba(255,255,255,0.05);
--border:rgba(255,255,255,0.12);
--text:#ffffff;
--muted:#b6c2d9;
--primary:#7dd3fc;
--shadow:0 25px 50px -12px rgba(0,0,0,0.5);
--chip:rgba(255,255,255,0.08);

--eitaa:#f57c00;
--rubika:#8d3189;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Vazirmatn',sans-serif;
min-height:100vh;
color:var(--text);
display:flex;
align-items:center;
justify-content:center;
padding:24px;

background:
radial-gradient(800px circle at 15% 10%, rgba(125,211,252,0.2), transparent 45%),
radial-gradient(700px circle at 85% 85%, rgba(56,189,248,0.15), transparent 50%),
linear-gradient(140deg,#070b18 0%,#0b1430 40%,#060e22 100%);
}

.card{
width:100%;
max-width:390px;
background:var(--card);
border:1px solid var(--border);
border-radius:35px;
backdrop-filter:blur(25px);
box-shadow:var(--shadow);
overflow:hidden;
}

.content{
padding:40px 24px 30px;
text-align:center;
}

.name{
font-size:1.65rem;
font-weight:800;
margin-bottom:8px;
}

.title{
font-size:0.95rem;
font-weight:600;
color:#7dd3fc;
margin-bottom:18px;
}

.bio{
color:var(--muted);
font-size:0.92rem;
line-height:2;
margin-bottom:25px;
}

.skills{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:8px;
margin-bottom:30px;
}

.skill{
background:var(--chip);
padding:6px 14px;
border-radius:12px;
font-size:0.8rem;
}

.save-btn{
display:block;
width:100%;
text-decoration:none;
background:linear-gradient(135deg,#7dd3fc,#0ea5e9);
color:#06152b;
font-weight:800;
padding:16px;
border-radius:20px;
margin-bottom:20px;
}

/* شبکه اجتماعی کنار هم */
.social-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-bottom:20px;
}

.social-btn{
text-decoration:none;
color:#fff;
padding:14px;
border-radius:18px;
font-weight:700;
font-size:0.95rem;
display:flex;
align-items:center;
justify-content:center;
}

.eitaa{background:var(--eitaa);}
.rubika{background:var(--rubika);}

/* دکمه‌های تماس زیر هم و بزرگ */
.call-section{
display:flex;
flex-direction:column;
gap:12px;
}

.call{
text-decoration:none;
background:rgba(255,255,255,0.1);
color:#fff;
padding:18px;
border-radius:20px;
font-weight:800;
font-size:1.05rem;
display:flex;
align-items:center;
justify-content:center;
}

.footer{
margin-top:25px;
color:rgba(255,255,255,0.3);
font-size:0.7rem;
letter-spacing:2px;
}

</style>
</head>

<body>

<div class="card">
